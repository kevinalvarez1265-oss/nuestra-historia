<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor</title>
    
    <!-- Librería para el Mapa (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Librería para el Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Librería para alertas bonitas (SweetAlert2) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Estilos generales y paleta de colores pastel */
        :root {
            --rosa-claro: #ffe6e6;
            --crema: #fff9f2;
            --dorado: #d4af37;
            --texto: #5a4f4f;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--rosa-claro);
            color: var(--texto);
            text-align: center;
            scroll-behavior: smooth; /* Hace que el deslizamiento sea suave */
        }

        section {
            min-height: 100vh; /* Cada sección ocupa toda la pantalla */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1, h2 {
            color: #d17b88;
            margin-bottom: 20px;
        }

        /* --- Sección 1: Foto Polaroid --- */
        #seccion-foto {
            background-color: var(--crema);
        }
        
        .polaroid {
            background: white;
            padding: 15px 15px 40px 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 5px;
            transform: rotate(-3deg);
            max-width: 300px;
        }

        .polaroid img {
            width: 100%;
            height: auto;
            border-radius: 3px;
            display: block; /* AHORA SE MUESTRA SIEMPRE */
        }

        .btn-subir {
            background-color: #d17b88;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-subir:hover { background-color: #b8626f; }

        /* --- Sección 2: Mapa --- */
        #seccion-mapa {
            background-color: var(--rosa-claro);
        }

        #mapa {
            width: 100%;
            max-width: 600px;
            height: 400px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 4px solid white;
        }

        /* --- Sección 3: Ruleta --- */
        #seccion-ruleta {
            background-color: var(--crema);
            overflow: hidden;
        }

        .ruleta-container {
            position: relative;
            width: 320px;
            height: 320px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .flecha {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #d17b88;
            z-index: 10;
        }

        /* --- Sección 4: Mensaje Final --- */
        #seccion-mensaje {
            background-color: #d17b88;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .mensaje-corazon {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            z-index: 2;
        }

        /* Animación de corazones flotando */
        .corazon-flotante {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: flotar 4s linear infinite;
        }

        @keyframes flotar {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .scroll-down {
            margin-top: 30px;
            font-size: 24px;
            animation: saltar 1s infinite;
        }

        @keyframes saltar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }
    </style>
</head>
<body>

    <!-- SECCIÓN 1: NUESTRA FOTO -->
    <section id="seccion-foto">
        <h2>Nuestra Foto Favorita 💕</h2>
        <div class="polaroid" id="marco-polaroid">
            <!-- SE CAMBIÓ LA RUTA PARA BUSCAR LA FOTO EN GITHUB -->
            <img id="imagen-pareja" src="nuestra-foto.jpeg" alt="Nuestra foto" />
        </div>
        
        <div class="scroll-down">⬇️ Desliza hacia abajo</div>
    </section>

    <!-- SECCIÓN 2: DÓNDE NOS CONOCIMOS -->
    <section id="seccion-mapa">
        <h2>Aquí empezó todo 🗺️</h2>
        <p>El lugar donde nuestra historia comenzó...</p>
        <div id="mapa"></div>
        
        <div class="scroll-down">⬇️ Desliza hacia abajo</div>
    </section>

    <!-- SECCIÓN 3: LA RULETA DE PLANES -->
    <section id="seccion-ruleta">
        <h2>Ruleta de Citas 🎡</h2>
        <p>Toca el botón y dejemos que el destino decida nuestro plan de hoy.</p>
        
        <div class="ruleta-container">
            <div class="flecha"></div>
            <canvas id="ruleta" width="400" height="400"></canvas>
        </div>
        
        <button class="btn-subir" onclick="girarRuleta()">¡Girar Ruleta!</button>
        
        <div class="scroll-down">⬇️ Desliza hacia abajo</div>
    </section>

    <!-- SECCIÓN 4: MENSAJE FINAL -->
    <section id="seccion-mensaje">
        <div class="mensaje-corazon">
            Eres el amor de mi vida,<br>recuérdalo siempre. ❤️
        </div>
        <!-- Contenedor para los corazones animados -->
        <div id="lluvia-corazones"></div>
    </section>

    <!-- LOGICA DE PROGRAMACIÓN (JAVASCRIPT) -->
    <script>
        // (Se eliminó la Lógica 1 porque la foto ahora se carga sola desde HTML)

        // ----------------------------------------------------
        // LÓGICA 2: MAPA CON CARTO POSITRON (Sin error 403)
        // ----------------------------------------------------
        // Coordenadas centrales de Bogotá (puedes cambiarlas luego si deseas)
        const latitud = 4.6097; 
        const longitud = -74.0817;
        
        const map = L.map('mapa').setView([latitud, longitud], 13);

        // Usamos CARTO Positron para tonos pastel y acceso gratuito sin bloqueos
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const marker = L.marker([latitud, longitud]).addTo(map);
        marker.bindPopup("<b>¡Aquí nos conocimos! ✨</b>").openPopup();

        // ----------------------------------------------------
        // LÓGICA 3: RULETA DE PLANES PERSONALIZADA
        // ----------------------------------------------------
        const canvas = document.getElementById("ruleta");
        const ctx = canvas.getContext("2d");
        
        // ¡Planes especialmente pensados para ustedes!
        const opciones = [
            "Hamburguesas en Chef Burger",
            "Copa Arequipe Crepes & Waffles",
            "Hacer pizza casera al horno",
            "Tarde de competencia en Karts",
            "Cafecito en Juan Valdez",
            "Viaje sorpresa a la costa",
            "Ver partido de la selección",
            "Cine y arrunchis"
        ];
        
        const colores = ["#f8b195", "#f67280", "#c06c84", "#6c5b7b", "#355c7d", "#99b898", "#feceab", "#ff847c"];
        let rotacionActual = 0;
        let girando = false;

        function dibujarRuleta() {
            const arco = (2 * Math.PI) / opciones.length;
            const centro = canvas.width / 2;

            for (let i = 0; i < opciones.length; i++) {
                const anguloInicio = i * arco;
                const anguloFin = anguloInicio + arco;

                ctx.beginPath();
                ctx.fillStyle = colores[i];
                ctx.moveTo(centro, centro);
                ctx.arc(centro, centro, centro, anguloInicio, anguloFin);
                ctx.fill();

                // Escribir el texto
                ctx.save();
                ctx.translate(centro, centro);
                ctx.rotate(anguloInicio + arco / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px sans-serif";
                ctx.fillText(opciones[i], centro - 15, 5);
                ctx.restore();
            }
        }
        dibujarRuleta();

        function girarRuleta() {
            if (girando) return; // Evita que gire varias veces a la vez
            girando = true;

            // Calcular rotación aleatoria (entre 5 y 10 vueltas completas)
            const vueltas = Math.floor(Math.random() * 5) + 5;
            const gradosExtra = Math.floor(Math.random() * 360);
            rotacionActual += (vueltas * 360) + gradosExtra;

            canvas.style.transform = `rotate(${rotacionActual}deg)`;

            // Esperar a que termine la animación (4 segundos de CSS)
            setTimeout(() => {
                girando = false;
                
                // Calcular qué opción ganó
                const gradosReales = rotacionActual % 360;
                // Ajuste por la flecha que está en la parte superior (270 grados en el canvas)
                const ajuste = (360 - gradosReales + 270) % 360;
                const indiceGanador = Math.floor(ajuste / (360 / opciones.length));
                
                const planGanador = opciones[indiceGanador];

                // Lanzar confeti
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                // Mostrar alerta bonita
                Swal.fire({
                    title: '¡Tenemos un plan!',
                    text: planGanador,
                    icon: 'heart',
                    confirmButtonText: '¡Me encanta!',
                    confirmButtonColor: '#d17b88'
                });

            }, 4000);
        }

        // ----------------------------------------------------
        // LÓGICA 4: LLUVIA DE CORAZONES EN EL MENSAJE FINAL
        // ----------------------------------------------------
        function crearCorazon() {
            const corazon = document.createElement('div');
            corazon.classList.add('corazon-flotante');
            corazon.innerHTML = '❤️';
            
            // Posición aleatoria horizontal
            corazon.style.left = Math.random() * 100 + 'vw';
            // Tamaño aleatorio
            corazon.style.fontSize = (Math.random() * 20 + 10) + 'px';
            // Duración aleatoria
            corazon.style.animationDuration = (Math.random() * 3 + 2) + 's';
            
            document.getElementById('lluvia-corazones').appendChild(corazon);
            
            // Eliminarlo después de que suba para no saturar la memoria
            setTimeout(() => {
                corazon.remove();
            }, 5000);
        }

        // Crear un corazón nuevo cada 300 milisegundos
        setInterval(crearCorazon, 300);

    </script>
</body>
</html>
